databases:
  - name: life-ai-db
    databaseName: life_ai
    user: life_user
    plan: free
    region: oregon

services:
  - type: web
    name: life-ai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: life-ai-db
          property: connectionString
