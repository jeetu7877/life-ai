name: Build Android APK (Life AI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Life AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build Web App
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor Android & Sync
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permissions for gradlew
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Life AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Life-AI-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
